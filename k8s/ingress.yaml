# D6: NGINX Ingress routing http://btc-forecast.local -> ClusterIP service.
# Requires: minikube addons enable ingress
# and a hosts-file entry for btc-forecast.local (see docs/RUNBOOK.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: btc-forecast-api
  namespace: btc-mlops
  labels:
    app: btc-forecast-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: btc-forecast.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: btc-forecast-api
                port:
                  number: 80
