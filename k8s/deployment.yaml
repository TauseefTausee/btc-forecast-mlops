# D3: highly available Flask/Gunicorn API.
# Image is pulled from Docker Hub user tauseeftausee (or load a local
# image with `minikube image load btc-forecast-api:latest` and use that name).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btc-forecast-api
  namespace: btc-mlops
  labels:
    app: btc-forecast-api
    app.kubernetes.io/part-of: btc-forecast
spec:
  replicas: 3                       # >= 3 for high availability; HPA takes over afterwards
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: btc-forecast-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0             # never drop below desired capacity during rollouts
      maxSurge: 1
  template:
    metadata:
      labels:
        app: btc-forecast-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        # hostPath volumes are created root-owned; hand them to the app user.
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /app/models/data && chown -R 10001:10001 /app/models || true"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: model-store
              mountPath: /app/models

        # Trains + registers a first model only if the PVC has none yet
        # (fresh cluster). Exits immediately when a model already exists.
        - name: model-bootstrap
          image: docker.io/tauseeftausee/btc-forecast-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.bootstrap"]
          envFrom:
            - configMapRef:
                name: btc-api-config
            - secretRef:
                name: btc-api-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: model-store
              mountPath: /app/models
            - name: tmp
              mountPath: /tmp

      containers:
        - name: api
          image: docker.io/tauseeftausee/btc-forecast-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          # D1: ConfigMap (non-sensitive) + Secret (sensitive) as env vars
          envFrom:
            - configMapRef:
                name: btc-api-config
            - secretRef:
                name: btc-api-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:            # restart frozen containers
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:           # only route traffic once the app answers
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: model-store       # D2: PVC with models + historical data
              mountPath: /app/models
            - name: tmp               # gunicorn heartbeat files (root FS is read-only)
              mountPath: /tmp

      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: btc-models-pvc
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
