# D1: configuration decoupled from code. Both objects are injected into the
# API container as environment variables (envFrom in deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-api-config
  namespace: btc-mlops
  labels:
    app: btc-forecast-api
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODEL_DIR: "/app/models"
  DATA_DIR: "/app/models/data"
  TICKER: "BTC-USD"
  FORECAST_HORIZON: "7"
  MAPE_THRESHOLD: "10"
  MODEL_REFRESH_SECONDS: "15"
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "2"
---
# Sensitive values. stringData is base64-encoded by the API server on apply.
# Replace the placeholder before applying, or create it from the CLI instead:
#   kubectl -n btc-mlops create secret generic btc-api-secret \
#     --from-literal=API_TOKEN=$(openssl rand -hex 24) --from-literal=COINGECKO_API_KEY=
apiVersion: v1
kind: Secret
metadata:
  name: btc-api-secret
  namespace: btc-mlops
  labels:
    app: btc-forecast-api
type: Opaque
stringData:
  API_TOKEN: "change-me-to-a-long-random-string"
  COINGECKO_API_KEY: ""
