# D5: scale the API between 2 and 8 pods to hold average CPU at 60% of the
# 100m request. Requires metrics-server (minikube addons enable metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: btc-forecast-api
  namespace: btc-mlops
  labels:
    app: btc-forecast-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: btc-forecast-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      # shorter than the 5-minute default so scale-down shows up in the demo
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
