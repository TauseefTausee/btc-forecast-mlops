# D4: internal ClusterIP (used by the Ingress and in-cluster clients) and an
# external NodePort. Both map port 80 -> container port 5000.
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-api
  namespace: btc-mlops
  labels:
    app: btc-forecast-api
spec:
  type: ClusterIP
  selector:
    app: btc-forecast-api
  ports:
    - name: http
      port: 80
      targetPort: http       # named container port 5000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-api-nodeport
  namespace: btc-mlops
  labels:
    app: btc-forecast-api
spec:
  type: NodePort
  selector:
    app: btc-forecast-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
