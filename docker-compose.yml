# Local integration environment: Flask API + Airflow (LocalExecutor) + Postgres.
#
#   cp .env.example .env          # Linux: set AIRFLOW_UID=$(id -u)
#   docker compose up -d --build
#
#   API      -> http://localhost:5000/health
#   Airflow  -> http://localhost:8080  (admin / admin by default)
#
# ./shared/models is the shared "model store": Airflow writes data + models
# there and the API hot-reloads from it.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: btc-airflow:local
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: btc-mlops-local-secret
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    PYTHONPATH: /opt/airflow
    MODEL_DIR: /opt/airflow/shared/models
    DATA_DIR: /opt/airflow/shared/models/data
    MAPE_THRESHOLD: ${MAPE_THRESHOLD:-10}
    API_TOKEN: ${API_TOKEN:-change-me}
    # Comma-separated list of API reload endpoints to notify after registration.
    RELOAD_URLS: http://api:5000/reload
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./shared/models:/opt/airflow/shared/models
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" --firstname BTC --lastname Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: train a first model if the shared store is empty, so the API
  # can serve before the DAG has ever run. Never blocks the stack.
  model-init:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: btc-forecast-api:local
    user: "${AIRFLOW_UID:-50000}:0"
    command: ["sh", "-c", "python -m src.bootstrap || echo 'bootstrap skipped (no data source reachable)'"]
    environment:
      MODEL_DIR: /app/models
      MAPE_THRESHOLD: ${MAPE_THRESHOLD:-10}
    volumes:
      - ./shared/models:/app/models
    restart: "no"

  api:
    image: btc-forecast-api:local
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      MODEL_DIR: /app/models
      MODEL_STAGE: production
      LOG_LEVEL: INFO
      PORT: "5000"
      API_TOKEN: ${API_TOKEN:-change-me}
    ports:
      - "5000:5000"
    volumes:
      - ./shared/models:/app/models
    depends_on:
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs:
