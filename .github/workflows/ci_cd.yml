name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  API_IMAGE: btc-forecast-api
  TRAINER_IMAGE: btc-forecast-trainer

jobs:
  lint-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Format check (black)
        run: black --check --diff .

      - name: Unit tests (pytest)
        run: pytest --junitxml=junit.xml --cov=src --cov=app --cov-report=term-missing --cov-report=xml

      - name: Compile Kubeflow pipeline
        run: python kubeflow/btc_kfp_pipeline.py --output kubeflow/btc_kfp_pipeline.yaml

      - name: Syntax-check Airflow DAG
        run: python -m py_compile dags/btc_etl_pipeline.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml

  build-push:
    name: Build & push Docker images
    needs: lint-test
    runs-on: ubuntu-latest
    env:
      # Push only for commits that land on main (not for pull requests).
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push API image (tags - commit SHA and latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || 'local' }}/${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME || 'local' }}/${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push trainer image (used by Kubeflow components)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || 'local' }}/${{ env.TRAINER_IMAGE }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME || 'local' }}/${{ env.TRAINER_IMAGE }}:latest
          cache-from: type=gha,scope=trainer
          cache-to: type=gha,mode=max,scope=trainer

      - name: Image summary
        if: env.PUSH == 'true'
        run: |
          echo "### Pushed images" >> "$GITHUB_STEP_SUMMARY"
          echo "- docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.API_IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.API_IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.TRAINER_IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
